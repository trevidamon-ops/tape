<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tape">
<meta name="theme-color" content="#0A0C0F">
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.webmanifest">
<title>Tape</title>
<script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js" defer></script>
<style>
:root{--bg:#0A0C0F;--card:#13171C;--line:#222831;--tx:#F2F4F6;--mute:#7C8794;--up:#5BF29B;--down:#FF5C6C;--sand:#E6C97A}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-variant-numeric:tabular-nums}
header{display:flex;justify-content:space-between;align-items:center;max-width:480px;margin:0 auto;padding:max(env(safe-area-inset-top),14px) 16px 6px}
.logo{font-size:22px;font-weight:700;letter-spacing:-.5px}
.hr{display:flex;gap:6px}
.ic{position:relative;width:40px;height:40px;border-radius:50%;border:0;background:var(--card);color:var(--tx);display:grid;place-items:center;cursor:pointer;flex:none}
.ic.sm{width:34px;height:34px}
.ic svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ic.sm svg{width:16px;height:16px}
.badge{position:absolute;top:-2px;right:-2px;background:var(--up);color:#06150C;border-radius:9px;font-size:11px;font-weight:700;padding:1px 5px}
main{max-width:480px;margin:0 auto;padding:4px 16px 100px}
.sub{color:var(--mute);font-size:13px;margin:2px 0 12px}
.tok{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:16px;padding:12px;margin-bottom:8px;cursor:pointer}
.av{position:relative;width:44px;height:44px;border-radius:50%;background:#1E252D;display:grid;place-items:center;font-weight:700;color:var(--mute);flex:none;overflow:hidden}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.mid{flex:1;min-width:0}.mid b{font-size:16px}
.rt{text-align:right}
.mute{color:var(--mute);font-size:13px}.up{color:var(--up)}.down{color:var(--down)}.sand{color:var(--sand)}
.pill{display:inline-block;border-radius:8px;padding:2px 8px;font-size:13px;font-weight:600}
.pill.up{background:rgba(91,242,155,.12)}.pill.down{background:rgba(255,92,108,.12)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-left:6px;vertical-align:middle}
.card{background:var(--card);border-radius:16px;padding:14px;margin-bottom:8px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.big{font-size:34px;font-weight:700;letter-spacing:-1px}
.pad{padding:24px 0;text-align:center}
.btn{display:inline-block;background:var(--up);color:#06150C;border:0;border-radius:14px;padding:14px 16px;font-size:16px;font-weight:700;text-align:center;text-decoration:none;cursor:pointer}
.btn.ghost{background:var(--card);color:var(--tx)}
.btn.sm{padding:10px 14px;font-size:14px;border-radius:10px}
.link{background:none;border:0;color:var(--down);font-size:13px;cursor:pointer;padding:4px 0}
input[type=text],input[type=password],input:not([type]){width:100%;background:var(--bg);border:1px solid var(--line);border-radius:12px;color:var(--tx);padding:12px;font-size:16px}
input:focus{outline:none;border-color:var(--sand)}
.gap{display:flex;gap:8px;margin-top:8px}
.sw{width:46px;height:28px;border-radius:14px;border:0;background:#2A323B;position:relative;flex:none;cursor:pointer}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.15s}
.sw.on{background:var(--up)}.sw.on::after{left:21px}
nav{position:fixed;left:0;right:0;bottom:0;background:rgba(10,12,15,.92);backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;max-width:160px;background:none;border:0;color:var(--mute);padding:15px 4px;font-size:14px;font-weight:600}
nav button.on{color:var(--tx)}
.sheet{position:fixed;inset:0;background:var(--bg);z-index:10;overflow-y:auto;-webkit-overflow-scrolling:touch}
.sheet>.in{max-width:480px;margin:0 auto;padding:max(env(safe-area-inset-top),12px) 16px 120px}
.sh{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.sh b{font-size:18px;flex:1}
#chart{height:360px;border-radius:14px;overflow:hidden;background:var(--bg)}
#chart iframe{width:100%;height:360px;border:0}
.tf{display:flex;gap:6px;margin:0 0 8px;align-items:center}
.chip{background:var(--card);border:0;color:var(--mute);border-radius:10px;padding:7px 12px;font-size:13px;font-weight:600;cursor:pointer}
.chip.on{background:#222831;color:var(--tx)}
.seg{display:flex;background:var(--card);border-radius:12px;padding:3px;margin-bottom:12px}
.seg button{flex:1;background:none;border:0;color:var(--mute);padding:9px 4px;border-radius:9px;font-size:14px;font-weight:600;cursor:pointer}
.seg button.on{background:#222831;color:var(--tx)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
.grid .card{margin:0}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin-bottom:10px}
.cal .h{text-align:center;color:var(--mute);font-size:11px;padding-bottom:2px}
.cd{border-radius:10px;min-height:58px;padding:5px;background:#101419;font-size:11px;color:#59626D;cursor:pointer;overflow:hidden}
.cd.sel{outline:1.5px solid var(--sand)}
.cd b{display:block;font-size:11px;margin-top:7px;font-weight:600;color:var(--tx);white-space:nowrap}
.bar{position:fixed;left:0;right:0;bottom:0;background:rgba(10,12,15,.95);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom));z-index:11}
.bar>div{max-width:480px;margin:0 auto;display:flex;gap:8px}
.bar .btn{flex:1}
.err{color:var(--down);font-size:13px;margin:0 0 10px}
#toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:#fff;color:#000;padding:10px 14px;border-radius:12px;font-size:14px;z-index:20;display:none;max-width:90%}
label.r{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:14px;margin-bottom:8px}
label.r input{width:110px}
h2{font-size:15px;margin:18px 0 8px}
.plan{font-size:13px;color:var(--mute);margin-top:6px}
.score{display:inline-block;background:rgba(91,242,155,.12);color:var(--up);border-radius:8px;padding:2px 8px;font-size:13px;font-weight:700}
#cstat{margin:6px 0 0}
.livebar{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:18px;padding:14px;margin-bottom:12px}
.pulse{width:12px;height:12px;border-radius:50%;background:var(--up);flex:none;animation:pl 1.6s infinite}
.pulse.slow{background:var(--sand);animation:none}
@keyframes pl{0%{box-shadow:0 0 0 0 rgba(91,242,155,.55)}70%{box-shadow:0 0 0 11px rgba(91,242,155,0)}100%{box-shadow:0 0 0 0 rgba(91,242,155,0)}}
#banner{position:fixed;left:0;right:0;top:0;z-index:30;display:none;padding:0 12px}
#banner .b{max-width:480px;margin:max(env(safe-area-inset-top),8px) auto 0;padding:13px 14px;background:#E9FFF3;color:#06150C;border-radius:18px;display:flex;gap:10px;align-items:center;box-shadow:0 8px 28px rgba(0,0,0,.55);cursor:pointer}
#banner .b.sell{background:#FFE9EC;color:#2A0A0F}
#lock{position:fixed;inset:0;background:var(--bg);z-index:50;display:none;align-items:center;justify-content:center;padding:24px}
#lock .in{width:100%;max-width:360px}
.tok{padding:14px;border-radius:18px}
.av{width:48px;height:48px}
details summary{color:var(--mute);font-size:13px;cursor:pointer;padding:6px 0}
#chart svg{display:block;width:100%}
.lnks{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.lnk{background:#1B2128;color:var(--tx);text-decoration:none;border-radius:10px;padding:7px 11px;font-size:13px}
.tag{display:inline-block;background:#222831;color:var(--mute);border-radius:8px;padding:1px 7px;font-size:12px;margin-left:6px}
</style>
</head>
<body>
<header><div class="logo">Tape</div><div class="hr" id="hr"></div></header>
<main id="app"></main>
<nav id="nav"></nav>
<div id="sheet"></div>
<div id="toast"></div>
<div id="banner"></div>
<div id="lock"></div>
<script>
"use strict";
const SOL = "So11111111111111111111111111111111111111112";
const USDC = "EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v", USDT = "Es9vMFrzaCERmJfrF4H2FYD4KCoNkY11McCe8BenwNYB";
const DEFAULT_RULES = { maxMcap: 1000000, minLiq: 10000, minScore: 75, stopPct: -22, priorityFee: 100000, minAge: 5 };
const RETAIN_DAYS = 7;
const MODES = {
  safe:     { label: "Safe",     maxMcap: 1000000, minLiq: 10000, minScore: 75, minAge: 5, stopPct: -22, tp: null },
  balanced: { label: "Balanced", maxMcap: 500000,  minLiq: 6000,  minScore: 65, minAge: 3, stopPct: -28, tp: 3 },
  moonshot: { label: "Moonshot", maxMcap: 150000,  minLiq: 3000,  minScore: 55, minAge: 2, stopPct: -35, tp: 6 }
};
let autoMode = { cur: "safe", pend: "", n: 0 };
const modeNow = () => (S.opts.mode && S.opts.mode !== "auto" && MODES[S.opts.mode]) ? S.opts.mode : autoMode.cur;
const RR = () => Object.assign({}, S.rules, { ...MODES[modeNow()], priorityFee: S.rules.priorityFee });
// Reads the market from coins we already track: SOL trend and how many new coins are rising with buyers ahead.
function readMarket() {
  const c = S.rows.filter(t => t.cand && t.liq > 2000); if (c.length < 8) return;
  const up = c.filter(t => t.chg1h > 0 && t.chg5m > 0 && t.b1 > t.s1).length / c.length;
  const sol = S.rows.find(r => r.mint === SOL)?.chg24h ?? 0;
  const want = (sol < -5 || up < 0.25) ? "safe" : (up > 0.5 && sol > 0) ? "moonshot" : "balanced";
  if (want === autoMode.cur) { autoMode.pend = ""; autoMode.n = 0; return; }
  if (want === autoMode.pend) autoMode.n++; else { autoMode.pend = want; autoMode.n = 1; }
  if (autoMode.n >= 3) { autoMode.cur = want; autoMode.pend = ""; autoMode.n = 0; if (S.opts.mode === "auto" || !S.opts.mode) notify(`Market looks ${want === "safe" ? "weak: switching to Safe mode" : want === "moonshot" ? "hot: switching to Moonshot mode" : "mixed: switching to Balanced mode"}.`, "info", ""); }
}
const LS = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  remove(k) { try { localStorage.removeItem(k); } catch {} }
};
const KEYS = { key: "key", fomo: "fomo", entries: "entries", rules: "rules2", snaps: "snaps", watch: "watch", trades: "trades", syms: "syms", histBefore: "histBefore", histDone: "histDone", calls: "calls", pool: "pool", checks: "checks", arch: "arch", basis: "basis", archCut: "archCut", follow: "follow", scouts: "scouts", opts: "opts" };
const D = () => ({ key: "", fomo: "", entries: {}, rules: { ...DEFAULT_RULES }, snaps: {}, watch: {}, trades: [], syms: {}, histBefore: "", histDone: false, calls: {}, pool: {}, checks: {},
  arch: { byDay: {}, tot: { pnl: 0, n: 0, cb: 0, wins: 0, best: 0 } }, basis: {}, archCut: 0, follow: {}, scouts: {}, opts: { sound: true, awake: true, mode: "auto" } });
const now0 = new Date();
const S = {
  tab: "snipes", ftab: "hold", hf: "all", sheet: null, err: "", busy: false, syncing: false, solUsd: 0, slow: false, lastScan: 0,
  ...(() => { const d = D(); if (!LS.get("vault", null)) for (const k in KEYS) d[k] = LS.get(KEYS[k], d[k]); d.rules = Object.assign({}, DEFAULT_RULES, d.rules); d.opts = Object.assign({ sound: true, awake: true, mode: "auto" }, d.opts); return d; })(),
  scan: { n: 0, ok: 0, passed: 0, rejected: 0 }, checkWhy: {}, rej: {},
  cal: { y: now0.getFullYear(), m: now0.getMonth(), sel: null },
  rows: [], synced: [], img: "", launches: [], log: [], unseen: 0, fmoves: {}
};

// ---------- privacy: encrypted storage (AES-256-GCM, key derived from your passphrase with PBKDF2) ----------
const VK = { key: null, salt: "" };
const te = new TextEncoder(), td = new TextDecoder();
const b64 = u => { let x = ""; for (let i = 0; i < u.length; i += 0x8000) x += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000)); return btoa(x); };
const unb64 = x => Uint8Array.from(atob(x), c => c.charCodeAt(0));
async function deriveKey(pass, salt) {
  const base = await crypto.subtle.importKey("raw", te.encode(pass), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({ name: "PBKDF2", salt, iterations: 310000, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]);
}
const hasVault = () => !!LS.get("vault", null);
function persistPlain() { for (const k in KEYS) LS.set(KEYS[k], S[k]); }
let vaultTimer = null;
function persist() {
  if (VK.key) { clearTimeout(vaultTimer); vaultTimer = setTimeout(flushVault, 400); return; }
  if (!hasVault()) persistPlain();   // never write plaintext while a vault exists
}
async function flushVault() {
  if (!VK.key) return; clearTimeout(vaultTimer);
  const snap = {}; for (const k in KEYS) snap[k] = S[k];
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = new Uint8Array(await crypto.subtle.encrypt({ name: "AES-GCM", iv }, VK.key, te.encode(JSON.stringify(snap))));
  LS.set("vault", { v: 1, salt: VK.salt, iv: b64(iv), ct: b64(ct) });
}
async function enableVault(pass) {
  const salt = crypto.getRandomValues(new Uint8Array(16));
  VK.salt = b64(salt); VK.key = await deriveKey(pass, salt);
  await flushVault(); for (const k in KEYS) LS.remove(KEYS[k]);
}
async function disableVault() { VK.key = null; VK.salt = ""; persistPlain(); LS.remove("vault"); }
async function tryUnlock(pass) {
  const v = LS.get("vault", null); if (!v) return false;
  try {
    const salt = unb64(v.salt), key = await deriveKey(pass, salt);
    const obj = JSON.parse(td.decode(await crypto.subtle.decrypt({ name: "AES-GCM", iv: unb64(v.iv) }, key, unb64(v.ct))));
    VK.key = key; VK.salt = v.salt; for (const k in KEYS) if (obj[k] !== undefined) S[k] = obj[k];
    S.rules = Object.assign({}, DEFAULT_RULES, S.rules); S.opts = Object.assign({ sound: true, awake: true, mode: "auto" }, S.opts);
    return true;
  } catch { return false; }
}
function showLock() {
  const el = $("lock"); el.style.display = "flex";
  el.innerHTML = `<div class="in"><div class="logo" style="margin-bottom:6px">Tape</div><p class="mute">Enter your passphrase to unlock.</p>
    <div class="gap"><input id="lockPw" type="password" placeholder="Passphrase" autocomplete="current-password"></div>
    <div class="gap"><button class="btn" style="flex:1" data-act="unlock">Unlock</button></div><p id="lockErr" class="err" style="margin-top:10px"></p>
    <button class="link" data-act="erase">Forgot it? Erase all data on this phone</button></div>`;
}
async function doUnlock() {
  const pw = $("lockPw")?.value || "";
  if (await tryUnlock(pw)) { $("lock").style.display = "none"; $("lock").innerHTML = ""; startApp(); }
  else { await new Promise(r => setTimeout(r, 800)); const e = $("lockErr"); if (e) e.textContent = "Wrong passphrase."; }
}
function resetState() {
  Object.assign(S, D(), { rows: [], synced: [], launches: [], log: [], unseen: 0, fmoves: {}, rej: {}, checkWhy: {}, scan: { n: 0, ok: 0, passed: 0, rejected: 0 }, sheet: null, img: "", err: "" });
  safetyCache.clear(); legitCache.clear(); infoCache.clear(); for (const k in REP) delete REP[k]; analyze.k = null;
  const b = $("banner"); if (b) b.style.display = "none"; badge();
}
async function lockApp() { await flushVault(); stopTimers(); VK.key = null; VK.salt = ""; resetState(); renderSheet(); $("app").innerHTML = ""; $("nav").innerHTML = ""; showLock(); }
function eraseAll() { for (const k in KEYS) LS.remove(KEYS[k]); LS.remove("vault"); try { location.reload(); } catch {} }
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const ADDR = /^[1-9A-HJ-NP-Za-km-z]{32,44}$/;
const px = n => { n = Number(n); if (!(n > 0)) return "0.00"; return n >= 1 ? n.toFixed(2) : n.toFixed(Math.min(12, Math.max(2, 3 - Math.floor(Math.log10(n))))); };
const usd = n => n >= 1e6 ? "$" + (n/1e6).toFixed(2) + "M" : n >= 1e3 ? "$" + (n/1e3).toFixed(1) + "K" : "$" + px(n);
const fmt = n => n >= 1e6 ? (n/1e6).toFixed(2) + "M" : n >= 1e4 ? (n/1e3).toFixed(1) + "K" : n >= 100 ? n.toFixed(0) : n.toFixed(2);
const sgn = n => (n >= 0 ? "+" : "-") + "$" + fmt(Math.abs(n));
const fq = n => n >= 1e6 ? (n/1e6).toFixed(2) + "M" : n >= 1e3 ? (n/1e3).toFixed(1) + "K" : n.toFixed(2);
const pill = n => `<span class="pill ${n >= 0 ? "up" : "down"}">${n >= 0 ? "+" : ""}${Number(n).toFixed(1)}%</span>`;
const short = a => a.slice(0, 4) + "…" + a.slice(-4);
const dayKey = ts => { const d = new Date(ts * 1000); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); };
const row = m => S.rows.find(r => r.mint === m);
const tokOf = m => row(m) || (S.calls[m] ? { mint: m, symbol: S.calls[m].sym, pair: S.calls[m].pair, img: S.calls[m].img, price: S.calls[m].price, mcap: S.calls[m].mcap, liq: S.calls[m].liq, vol1h: 0, chg1h: 0, chg24h: 0, chg5m: 0, chg6h: 0 } : null);
const price = m => row(m)?.price ?? 0;
const sym = m => row(m)?.symbol || S.syms[m]?.s || S.calls[m]?.sym || short(m);
const ageStr = ms => { const m = Math.max(0, Math.round(ms / 60000)); return m < 60 ? m + "m" : m < 1440 ? Math.round(m / 60) + "h" : Math.round(m / 1440) + "d"; };
const toast = t => { const e = $("toast"); e.textContent = t; e.style.display = "block"; clearTimeout(toast.t); toast.t = setTimeout(() => e.style.display = "none", 4000); };
const dollars = sol => S.solUsd ? "$" + Math.round(sol * S.solUsd).toLocaleString() : sol.toFixed(1) + " SOL";
// ---------- alerts: banner that stays until dismissed, sound, vibration, icon badge, system notification ----------
let AC = null, REG = null, alertSeq = 0;
function unlockAudio() { try { AC = AC || new (window.AudioContext || window.webkitAudioContext)(); if (AC.state === "suspended") AC.resume(); } catch {} }
function beep() {
  if (!S.opts.sound || !AC) return;
  try { [880, 1175].forEach((f, i) => { const o = AC.createOscillator(), g = AC.createGain(); o.frequency.value = f; g.gain.value = 0.18; o.connect(g); g.connect(AC.destination); o.start(AC.currentTime + i * 0.2); o.stop(AC.currentTime + i * 0.2 + 0.15); }); } catch {}
}
function badge() { try { if (navigator.setAppBadge) { S.unseen ? navigator.setAppBadge(S.unseen) : navigator.clearAppBadge(); } } catch {} try { document.title = S.unseen ? `(${S.unseen}) Tape` : "Tape"; } catch {} }
const TITLES = { buy: "New snipe", sell: "Sell signal", trader: "Trader move", wallet: "Wallet move", info: "Tape" };
function showBanner(a) {
  const el = $("banner"); if (!el) return;
  el.innerHTML = `<div class="b ${a.kind === "sell" ? "sell" : ""}" data-act="bn" data-m="${esc(a.mint || "")}"><div style="flex:1"><b>${TITLES[a.kind] || "Tape"}</b><div style="font-size:14px">${esc(a.text)}</div></div><button class="link" data-act="bnx" aria-label="Dismiss" style="color:inherit;font-size:22px">✕</button></div>`;
  el.style.display = "block";
}
function sysNotify(a) {
  try {
    if (typeof Notification === "undefined" || Notification.permission !== "granted") return;
    const o = { body: a.text, tag: "tape-" + a.id, data: { mint: a.mint || "" } };
    if (REG && REG.showNotification) REG.showNotification(TITLES[a.kind] || "Tape", o); else new Notification(TITLES[a.kind] || "Tape", o);
  } catch {}
}
function alertUser(a) {
  a.id = ++alertSeq; a.t = Date.now(); S.log.unshift(a); S.log = S.log.slice(0, 30); S.unseen++;
  showBanner(a); beep(); try { navigator.vibrate && navigator.vibrate([200, 100, 200]); } catch {} badge(); sysNotify(a);
}
const notify = (text, kind = "info", mint = "") => alertUser({ kind, text, mint });
let WL = null;
async function setWake() {
  try {
    if (S.opts.awake && navigator.wakeLock && !document.hidden && !WL) { WL = await navigator.wakeLock.request("screen"); WL.addEventListener("release", () => { WL = null; }); }
    else if (!S.opts.awake && WL) { await WL.release(); WL = null; }
  } catch {}
}

async function getJSON(url, signal) { try { const r = await fetch(url, signal ? { signal } : undefined); if (!r.ok) return null; return await r.json(); } catch { return null; } }

// ---------- data: Dexscreener (market facts), GeckoTerminal (new pools + candles), RugCheck, Helius, CoinGecko ----------
async function getTokens(mints) {

async function rugCheck(mint) {

  const j = await getJSON(`https://api.rugcheck.xyz/v1/tokens/${mint}/report`);
  let v = null;
  if (j) {
    const score = Number(j.score_normalised ?? j.score ?? 0); // higher = riskier
    const mintRevoked = !j.mintAuthority, freezeRevoked = !j.freezeAuthority;
    const lp = Math.max(0, ...(j.markets || []).map(m => m.lp?.lpLockedPct ?? 0));
    const top10 = (j.topHolders || []).slice(0, 10).reduce((s, h) => s + (h.pct ?? 0), 0);
    const holders = (j.topHolders || []).map(h => ({ addr: h.owner || h.address || "", pct: h.pct ?? 0, insider: !!h.insider })).filter(h => ADDR.test(h.addr)).slice(0, 10);
    const insiders = (j.topHolders || []).filter(h => h.insider).map(h => ({ addr: h.owner || h.address || "", pct: h.pct ?? 0 })).filter(h => ADDR.test(h.addr));

}

let solSeries = null;
async function ensureSol() {
  if (solSeries) return;

  solSeries = (j && j.prices) || [];

function solAt(ts) {
  if (S.solUsd && Date.now() / 1000 - ts < 3600) return S.solUsd;
  if (!solSeries || !solSeries.length) return S.solUsd || 0;
  const ms = ts * 1000; let lo = 0, hi = solSeries.length - 1;
  while (lo < hi) { const m = (lo + hi) >> 1; if (solSeries[m][0] < ms) lo = m + 1; else hi = m; }
  const a = solSeries[lo], b = solSeries[Math.max(0, lo - 1)];
  return Math.abs(a[0] - ms) < Math.abs(b[0] - ms) ? a[1] : b[1];
}
// A trade = exactly one non-quote token moved, against USDC/USDT (exact) or SOL (valued at that day's SOL price).
function parseTrade(tx, w) {
  const d = {};
  for (const t of tx.tokenTransfers || []) {
    const a = Number(t.tokenAmount) || 0;
    if (t.toUserAccount === w) d[t.mint] = (d[t.mint] || 0) + a;
    if (t.fromUserAccount === w) d[t.mint] = (d[t.mint] || 0) - a;
  }
  let sol = 0;
  for (const a of tx.accountData || []) if (a.account === w) sol += Number(a.nativeBalanceChange || 0) / 1e9;
  const stable = (d[USDC] || 0) + (d[USDT] || 0);
  for (const m of [SOL, USDC, USDT]) delete d[m];
  const bases = Object.entries(d).filter(([, v]) => Math.abs(v) > 0);
  if (bases.length !== 1) return null;
  const [mint, qty] = bases[0];
  let usdv = 0;
  if (Math.abs(stable) > 0.01 && Math.sign(stable) !== Math.sign(qty)) usdv = Math.abs(stable);
  else if (Math.abs(sol) > 0.005 && Math.sign(sol) !== Math.sign(qty)) usdv = Math.abs(sol) * solAt(tx.timestamp);
  if (!(usdv > 0)) return null;
  return { sig: tx.signature, ts: tx.timestamp, mint, side: qty > 0 ? "buy" : "sell", qty: Math.abs(qty), usd: usdv };
}

async function refresh(full = true, wallets = true) {
  if (S.busy || (!VK.key && hasVault())) return; S.busy = true; S.err = "";

    if (full && S.fomo) {
      if (!S.key) S.err = "Add your Helius key in Settings to sync your Fomo wallet.";
      else { const b = await getBalances(S.fomo); if (b) S.synced = b; else S.err = "Couldn't read your Fomo wallet. Check the address and key."; }
    }

    // 1. discover brand-new coins and start tracking them the moment they appear
    const found = await discover(), t0 = Date.now();
    for (const m of found) if (!S.pool[m]) { S.pool[m] = t0; S.launches.unshift({ m, t: t0 }); }
    S.launches = S.launches.slice(0, 40); pruneState();

    // 2. market facts for everything we care about

    for (const t of rows) if (t.cand && !S.calls[t.mint]) { const p = scoreCand(t); t.why = p.ok ? "" : p.why; }
    // 3. strict filters: market gates first, then safety checks on the best few
    const pre = rows.filter(t => t.cand && !S.calls[t.mint]).map(t => ({ t, p: scoreCand(t) })).filter(x => x.p.ok).sort((a, b) => b.p.score - a.p.score).slice(0, 12);
    await Promise.all([...pre.map(x => rugCheck(x.t.mint)), ...callMints.slice(0, 6).map(rugCheck)]);
    let passed = 0;
    for (const x of pre) { x.t.safety = sfOf(x.t.mint); const f = finalScore(x.t); x.t.score = f.ok ? f.score : 0; x.t.reasons = f.reasons || []; x.t.eligible = !!f.ok; if (!f.ok) x.t.why = f.why || ""; if (f.ok) passed++; }
    S.rows = rows; S.solUsd = rows.find(r => r.mint === SOL)?.price || S.solUsd; S.scan = { n: cand.length, ok: pre.length, passed };
    // 4. the one calculated sell signal per open call

      if (!t || !(t.price > 0)) {
        if (row(SOL)) { c.miss = (c.miss || 0) + 1; if (c.miss >= 3) { c.status = "closed"; c.sellTs = Date.now(); c.sellPrice = 0; c.sellMcap = 0; c.why = "Pair disappeared, likely rugged"; notify(`SELL ${c.sym}: pair disappeared, likely rugged.`, "sell", c.mint); } }
        continue;
      }
      c.miss = 0; c.peak = Math.max(c.peak || c.price, t.price);
      if (!c.half && c.tp > c.price * 2.5 && t.price >= c.price * 2) { c.half = true; notify(`TAKE HALF ${c.sym}: up 2x. Sell half to get your money back, the rest rides with a trailing stop.`, "sell", c.mint); }
      const why = checkSell(c, t);
      if (why) { c.status = "closed"; c.sellTs = Date.now(); c.sellPrice = t.price; c.sellMcap = t.mcap; c.why = why; notify(`SELL ${c.sym}: ${why} (${t.price >= c.price ? "+" : ""}${((t.price / c.price - 1) * 100).toFixed(0)}% since the buy signal)`, "sell", c.mint); }
    }

    let slots = 3 - Object.values(S.calls).filter(c => !c.manual && c.ts > Date.now() - 864e5).length;
    for (const t of rows.filter(t => t.eligible && t.score >= RR().minScore && !S.calls[t.mint]).sort((a, b) => b.score - a.score).slice(0, 4)) {
      if (slots <= 0) break;
      const L = await legit(t);
      if (!L.pass) { S.rej[t.mint] = L.reason; continue; }
      slots--; delete S.rej[t.mint];
      const c = S.calls[t.mint] = makeCall(t, L);
      notify(`BUY ${c.sym} at ${usd(c.mcap)} MC · score ${c.score}. Sell plan: target ${usd(c.tp / c.price * c.mcap)} MC, stop ${((c.stop / c.price - 1) * 100).toFixed(0)}%.`, "buy", c.mint);
    }

    for (const m of Object.keys(S.checks)) { const t = row(m); if (t && !S.calls[m]) await evalManual(t); }

      if (v > 0) { S.snaps[day] = v; persist(); }

}

      break;
    }
    case "fomo": {
      try { navigator.clipboard.writeText(b.dataset.m); } catch {}
      toast("Token address copied. Paste it in Fomo's search.");
      setTimeout(() => { location.href = "https://fomo.family"; }, 1200);
      return;
    }
    case "addFomo": case "addFomo2": {
      const a = v(b.dataset.act === "addFomo" ? "fIn" : "fIn2");
      if (!ADDR.test(a)) { toast("That doesn't look like a Solana address."); return; }
      if (a !== S.fomo) resetHistory();
      S.fomo = a; persist(); refresh(); if (S.sheet?.type === "settings") renderSheet(); break;
    }
    case "rmFomo": S.fomo = ""; S.synced = []; resetHistory(); persist(); renderSheet(); break;
    case "saveKey": S.key = v("kIn"); persist(); toast("Saved."); refresh(); break;
    case "notif": try { Notification.requestPermission(); } catch { toast("This browser doesn't support notifications."); } return;
  }
  if (document.activeElement) document.activeElement.blur(); render();
});
document.addEventListener("keydown", e => { if (e.key === "Enter" && e.target && e.target.id === "lockPw") doUnlock(); });
document.addEventListener("change", e => {
  const t = e.target;
  if (t.dataset.rule) {
    const k = t.dataset.rule; let v = Number(t.value) || 0;
    if (k === "priorityFee") { v = Math.max(0, Math.round(v)); t.value = v; if (v > 10000000) toast("That is over 0.01 SOL per trade. Double check it."); }
    S.rules[k] = v; persist();
    const h = $("feeHint"); if (h) h.textContent = feeHint();
  }
  if (t.dataset.entry) { S.entries[t.dataset.entry] = Number(t.value) || 0; persist(); t.blur(); render(); }
});
let timers = [], tickN = 0, hiddenAt = 0;
function stopTimers() { timers.forEach(clearInterval); timers = []; }
function startApp() {
  stopTimers(); pruneState(); render(); refresh(true, true); setWake();
  timers.push(setInterval(() => { if (!document.hidden) { tickN++; refresh(tickN % 4 === 0, tickN % 2 === 0); } }, 10000));
  try { if ("serviceWorker" in navigator) navigator.serviceWorker.register("./sw.js").then(r => { REG = r; }).catch(() => {}); } catch {}
}
document.addEventListener("visibilitychange", () => {
  if (document.hidden) { hiddenAt = Date.now(); flushVault(); return; }
  if (!VK.key && hasVault()) return;
  if (VK.key && hiddenAt && Date.now() - hiddenAt > 5 * 60e3) { lockApp(); return; }
  refresh(true, true); setWake();
});
if (hasVault()) showLock(); else startApp();
</script>
