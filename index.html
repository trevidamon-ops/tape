<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tape">
<meta name="theme-color" content="#0A0C0F">
<meta name="robots" content="noindex">
<title>Tape</title>
<script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js" defer></script>
<style>
:root{--bg:#0A0C0F;--card:#13171C;--line:#222831;--tx:#F2F4F6;--mute:#7C8794;--up:#5BF29B;--down:#FF5C6C;--sand:#E6C97A}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-variant-numeric:tabular-nums}
header{display:flex;justify-content:space-between;align-items:center;max-width:480px;margin:0 auto;padding:max(env(safe-area-inset-top),14px) 16px 6px}
.logo{font-size:22px;font-weight:700;letter-spacing:-.5px}
.hr{display:flex;gap:6px}
.ic{position:relative;width:40px;height:40px;border-radius:50%;border:0;background:var(--card);color:var(--tx);display:grid;place-items:center;cursor:pointer;flex:none}
.ic.sm{width:34px;height:34px}
.ic svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ic.sm svg{width:16px;height:16px}
.badge{position:absolute;top:-2px;right:-2px;background:var(--up);color:#06150C;border-radius:9px;font-size:11px;font-weight:700;padding:1px 5px}
main{max-width:480px;margin:0 auto;padding:4px 16px 100px}
.sub{color:var(--mute);font-size:13px;margin:2px 0 12px}
.tok{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:16px;padding:12px;margin-bottom:8px;cursor:pointer}
.av{position:relative;width:44px;height:44px;border-radius:50%;background:#1E252D;display:grid;place-items:center;font-weight:700;color:var(--mute);flex:none;overflow:hidden}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.mid{flex:1;min-width:0}.mid b{font-size:16px}
.rt{text-align:right}
.mute{color:var(--mute);font-size:13px}.up{color:var(--up)}.down{color:var(--down)}.sand{color:var(--sand)}
.pill{display:inline-block;border-radius:8px;padding:2px 8px;font-size:13px;font-weight:600}
.pill.up{background:rgba(91,242,155,.12)}.pill.down{background:rgba(255,92,108,.12)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-left:6px;vertical-align:middle}
.card{background:var(--card);border-radius:16px;padding:14px;margin-bottom:8px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.big{font-size:34px;font-weight:700;letter-spacing:-1px}
.pad{padding:24px 0;text-align:center}
.btn{display:inline-block;background:var(--up);color:#06150C;border:0;border-radius:14px;padding:14px 16px;font-size:16px;font-weight:700;text-align:center;text-decoration:none;cursor:pointer}
.btn.ghost{background:var(--card);color:var(--tx)}
.btn.sm{padding:10px 14px;font-size:14px;border-radius:10px}
.link{background:none;border:0;color:var(--down);font-size:13px;cursor:pointer;padding:4px 0}
input[type=text],input:not([type]){width:100%;background:var(--bg);border:1px solid var(--line);border-radius:12px;color:var(--tx);padding:12px;font-size:16px}
input:focus{outline:none;border-color:var(--sand)}
.gap{display:flex;gap:8px;margin-top:8px}
.sw{width:46px;height:28px;border-radius:14px;border:0;background:#2A323B;position:relative;flex:none;cursor:pointer}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.15s}
.sw.on{background:var(--up)}.sw.on::after{left:21px}
nav{position:fixed;left:0;right:0;bottom:0;background:rgba(10,12,15,.92);backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;max-width:160px;background:none;border:0;color:var(--mute);padding:15px 4px;font-size:14px;font-weight:600}
nav button.on{color:var(--tx)}
.sheet{position:fixed;inset:0;background:var(--bg);z-index:10;overflow-y:auto;-webkit-overflow-scrolling:touch}
.sheet>.in{max-width:480px;margin:0 auto;padding:max(env(safe-area-inset-top),12px) 16px 120px}
.sh{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.sh b{font-size:18px;flex:1}
#chart{height:360px;border-radius:14px;overflow:hidden;background:var(--bg)}
#chart iframe{width:100%;height:360px;border:0}
.tf{display:flex;gap:6px;margin:0 0 8px;align-items:center}
.chip{background:var(--card);border:0;color:var(--mute);border-radius:10px;padding:7px 12px;font-size:13px;font-weight:600;cursor:pointer}
.chip.on{background:#222831;color:var(--tx)}
.seg{display:flex;background:var(--card);border-radius:12px;padding:3px;margin-bottom:12px}
.seg button{flex:1;background:none;border:0;color:var(--mute);padding:9px 4px;border-radius:9px;font-size:14px;font-weight:600;cursor:pointer}
.seg button.on{background:#222831;color:var(--tx)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
.grid .card{margin:0}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin-bottom:10px}
.cal .h{text-align:center;color:var(--mute);font-size:11px;padding-bottom:2px}
.cd{border-radius:10px;min-height:58px;padding:5px;background:#101419;font-size:11px;color:#59626D;cursor:pointer;overflow:hidden}
.cd.sel{outline:1.5px solid var(--sand)}
.cd b{display:block;font-size:11px;margin-top:7px;font-weight:600;color:var(--tx);white-space:nowrap}
.bar{position:fixed;left:0;right:0;bottom:0;background:rgba(10,12,15,.95);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom));z-index:11}
.bar>div{max-width:480px;margin:0 auto;display:flex;gap:8px}
.bar .btn{flex:1}
.err{color:var(--down);font-size:13px;margin:0 0 10px}
#toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:#fff;color:#000;padding:10px 14px;border-radius:12px;font-size:14px;z-index:20;display:none;max-width:90%}
label.r{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:14px;margin-bottom:8px}
label.r input{width:110px}
h2{font-size:15px;margin:18px 0 8px}
</style>
</head>
<body>
<header><div class="logo">Tape</div><div class="hr" id="hr"></div></header>
<main id="app"></main>
<nav id="nav"></nav>
<div id="sheet"></div>
<div id="toast"></div>
<script>
"use strict";
const SOL = "So11111111111111111111111111111111111111112";
const USDC = "EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v", USDT = "Es9vMFrzaCERmJfrF4H2FYD4KCoNkY11McCe8BenwNYB";
const DEFAULT_RULES = { maxMcap: 5000000, minLiq: 20000, minSpike: 3, requireSafe: true, sellDropPct: -25 };
const LS = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};
const now0 = new Date();
const S = {
  tab: "feed", ftab: "hold", hf: "all", sheet: null, err: "", busy: false, syncing: false, solUsd: 0,
  key: LS.get("key", ""), fomo: LS.get("fomo", ""), entries: LS.get("entries", {}),
  rules: Object.assign({}, DEFAULT_RULES, LS.get("rules", {})), snaps: LS.get("snaps", {}), watch: LS.get("watch", {}),
  trades: LS.get("trades", []), syms: LS.get("syms", {}), histBefore: LS.get("histBefore", ""), histDone: LS.get("histDone", false),
  cal: { y: now0.getFullYear(), m: now0.getMonth(), sel: null },
  rows: [], synced: [], alerts: [], img: ""
};
const persist = () => ["key","fomo","entries","rules","snaps","watch","trades","syms","histBefore","histDone"].forEach(k => LS.set(k, S[k]));
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const ADDR = /^[1-9A-HJ-NP-Za-km-z]{32,44}$/;
const px = n => { n = Number(n); if (!(n > 0)) return "0.00"; return n >= 1 ? n.toFixed(2) : n.toFixed(Math.min(12, Math.max(2, 3 - Math.floor(Math.log10(n))))); };
const usd = n => n >= 1e6 ? "$" + (n/1e6).toFixed(2) + "M" : n >= 1e3 ? "$" + (n/1e3).toFixed(1) + "K" : "$" + px(n);
const fmt = n => n >= 1e6 ? (n/1e6).toFixed(2) + "M" : n >= 1e4 ? (n/1e3).toFixed(1) + "K" : n >= 100 ? n.toFixed(0) : n.toFixed(2);
const sgn = n => (n >= 0 ? "+" : "-") + "$" + fmt(Math.abs(n));
const fq = n => n >= 1e6 ? (n/1e6).toFixed(2) + "M" : n >= 1e3 ? (n/1e3).toFixed(1) + "K" : n.toFixed(2);
const pill = n => `<span class="pill ${n >= 0 ? "up" : "down"}">${n >= 0 ? "+" : ""}${Number(n).toFixed(1)}%</span>`;
const short = a => a.slice(0, 4) + "…" + a.slice(-4);
const dayKey = ts => { const d = new Date(ts * 1000); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); };
const row = m => S.rows.find(r => r.mint === m);
const price = m => row(m)?.price ?? 0;
const sym = m => S.syms[m]?.s || row(m)?.symbol || short(m);
const toast = t => { const e = $("toast"); e.textContent = t; e.style.display = "block"; clearTimeout(toast.t); toast.t = setTimeout(() => e.style.display = "none", 2800); };
const dollars = sol => S.solUsd ? "$" + Math.round(sol * S.solUsd).toLocaleString() : sol.toFixed(1) + " SOL";

async function getJSON(url) { try { const r = await fetch(url); if (!r.ok) return null; return await r.json(); } catch { return null; } }

// ---------- data: Dexscreener, GeckoTerminal, RugCheck, Helius, CoinGecko ----------
async function getTrending() {
  const j = await getJSON("https://api.dexscreener.com/token-boosts/top/v1");
  if (!Array.isArray(j)) return null;
  return [...new Set(j.filter(t => t.chainId === "solana").map(t => t.tokenAddress))];
}
async function getTokens(mints) {
  const list = [...new Set(mints)], best = new Map();
  for (let i = 0; i < list.length; i += 30) {
    const j = await getJSON("https://api.dexscreener.com/latest/dex/tokens/" + list.slice(i, i + 30).join(","));
    for (const p of (j && j.pairs) || []) {
      if (p.chainId !== "solana") continue;
      const m = p.baseToken.address, cur = best.get(m);
      if (!cur || (p.liquidity?.usd ?? 0) > (cur.liquidity?.usd ?? 0)) best.set(m, p);
    }
  }
  return [...best.values()].map(p => ({
    mint: p.baseToken.address, symbol: p.baseToken.symbol, pair: p.pairAddress, img: p.info?.imageUrl || "",
    price: Number(p.priceUsd ?? 0), mcap: p.marketCap ?? p.fdv ?? 0, liq: p.liquidity?.usd ?? 0,
    vol1h: p.volume?.h1 ?? 0, vol24h: p.volume?.h24 ?? 0, chg1h: p.priceChange?.h1 ?? 0, chg24h: p.priceChange?.h24 ?? 0
  }));
}
const safetyCache = new Map();
async function rugCheck(mint) {
  const c = safetyCache.get(mint);
  if (c && Date.now() - c.t < 300000) return c.v;
  const j = await getJSON(`https://api.rugcheck.xyz/v1/tokens/${mint}/report`);
  let v = null;
  if (j) {
    const score = Number(j.score_normalised ?? j.score ?? 0); // higher = riskier
    const mintRevoked = !j.mintAuthority, freezeRevoked = !j.freezeAuthority;
    const lp = Math.max(0, ...(j.markets || []).map(m => m.lp?.lpLockedPct ?? 0));
    const top10 = (j.topHolders || []).slice(0, 10).reduce((s, h) => s + (h.pct ?? 0), 0);
    const insiders = (j.topHolders || []).filter(h => h.insider).map(h => ({ addr: h.owner || h.address || "", pct: h.pct ?? 0 })).filter(h => ADDR.test(h.addr));
    let verdict = "ok";
    if (score >= 50 || !mintRevoked || !freezeRevoked) verdict = "danger";
    else if (score >= 25 || lp < 50 || top10 > 40) verdict = "caution";
    v = { score, mintRevoked, freezeRevoked, lp, top10, insiders, verdict };
  }
  safetyCache.set(mint, { t: Date.now(), v });
  return v;
}
async function getBalances(addr) {
  const j = await getJSON(`https://api.helius.xyz/v0/addresses/${addr}/balances?api-key=${encodeURIComponent(S.key)}`);
  if (!j) return null;
  const out = (j.tokens || []).map(t => ({ mint: t.mint, amount: Number(t.amount) / 10 ** (t.decimals ?? 0) })).filter(t => t.amount > 0);
  const sol = Number(j.nativeBalance ?? 0) / 1e9;
  if (sol > 0.01) out.push({ mint: SOL, amount: sol });
  return out;
}
async function getSwaps(addr) {
  const j = await getJSON(`https://api.helius.xyz/v0/addresses/${addr}/transactions?api-key=${encodeURIComponent(S.key)}&type=SWAP&limit=5`);
  if (!Array.isArray(j)) return [];
  return j.map(t => {
    const s = t.events?.swap, b = s?.nativeInput, o = s?.nativeOutput;
    return { sig: t.signature, wallet: addr, ts: t.timestamp, side: b ? "bought" : o ? "sold" : "swapped",
      sol: Number(b?.amount ?? o?.amount ?? 0) / 1e9, mint: b ? s?.tokenOutputs?.[0]?.mint : s?.tokenInputs?.[0]?.mint };
  });
}

// ---------- your trade history (read from your wallet's on-chain activity) ----------
let solSeries = null;
async function ensureSol() {
  if (solSeries) return;
  const j = await getJSON("https://api.coingecko.com/api/v3/coins/solana/market_chart?vs_currency=usd&days=365");
  solSeries = (j && j.prices) || [];
}
function solAt(ts) {
  if (!solSeries || !solSeries.length) return S.solUsd || 0;
  const ms = ts * 1000; let lo = 0, hi = solSeries.length - 1;
  while (lo < hi) { const m = (lo + hi) >> 1; if (solSeries[m][0] < ms) lo = m + 1; else hi = m; }
  const a = solSeries[lo], b = solSeries[Math.max(0, lo - 1)];
  return Math.abs(a[0] - ms) < Math.abs(b[0] - ms) ? a[1] : b[1];
}
// A trade = exactly one non-quote token moved, against USDC/USDT (exact) or SOL (valued at that day's SOL price).
function parseTrade(tx, w) {
  const d = {};
  for (const t of tx.tokenTransfers || []) {
    const a = Number(t.tokenAmount) || 0;
    if (t.toUserAccount === w) d[t.mint] = (d[t.mint] || 0) + a;
    if (t.fromUserAccount === w) d[t.mint] = (d[t.mint] || 0) - a;
  }
  let sol = 0;
  for (const a of tx.accountData || []) if (a.account === w) sol += Number(a.nativeBalanceChange || 0) / 1e9;
  const stable = (d[USDC] || 0) + (d[USDT] || 0);
  for (const m of [SOL, USDC, USDT]) delete d[m];
  const bases = Object.entries(d).filter(([, v]) => Math.abs(v) > 0);
  if (bases.length !== 1) return null;
  const [mint, qty] = bases[0];
  let usdv = 0;
  if (Math.abs(stable) > 0.01 && Math.sign(stable) !== Math.sign(qty)) usdv = Math.abs(stable);
  else if (Math.abs(sol) > 0.005 && Math.sign(sol) !== Math.sign(qty)) usdv = Math.abs(sol) * solAt(tx.timestamp);
  if (!(usdv > 0)) return null;
  return { sig: tx.signature, ts: tx.timestamp, mint, side: qty > 0 ? "buy" : "sell", qty: Math.abs(qty), usd: usdv };
}
async function syncTrades(older) {
  if (!S.fomo || !S.key) return;
  S.syncing = true;
  try {
    await ensureSol();
    const first = !S.histBefore && !S.histDone && !older;
    let before = older ? S.histBefore : "";
    const known = new Set(S.trades.map(t => t.sig)), fresh = [];
    for (let p = 0; p < 5; p++) {
      const txs = await getJSON(`https://api.helius.xyz/v0/addresses/${S.fomo}/transactions?api-key=${encodeURIComponent(S.key)}&limit=100${before ? "&before=" + before : ""}`);
      if (!Array.isArray(txs)) break;
      if (!txs.length) { if (older || first) S.histDone = true; break; }
      let hit = false;
      for (const tx of txs) {
        if (known.has(tx.signature)) { hit = true; continue; }
        known.add(tx.signature);
        const t = parseTrade(tx, S.fomo); if (t) fresh.push(t);
      }
      before = txs[txs.length - 1].signature;
      if (older || first) S.histBefore = before;
      if (txs.length < 100) { if (older || first) S.histDone = true; break; }
      if (hit && !older && !first) break;
    }
    if (fresh.length) S.trades = [...S.trades, ...fresh];
    const miss = [...new Set(S.trades.map(t => t.mint))].filter(m => !S.syms[m]);
    if (miss.length) { for (const t of await getTokens(miss)) S.syms[t.mint] = { s: t.symbol, i: t.img }; for (const m of miss) S.syms[m] ||= { s: short(m), i: "" }; }
    persist();
  } catch (e) { /* keep what we have */ }
  S.syncing = false;
}
function analyze() {
  const k = S.trades.length + ":" + (S.trades[S.trades.length - 1]?.sig || "");
  if (analyze.k === k) return analyze.v;
  const list = [...S.trades].sort((a, b) => a.ts - b.ts), pos = {}, out = [];
  for (const t of list) {
    const p = pos[t.mint] ||= { qty: 0, cost: 0 };
    if (t.side === "buy") { p.qty += t.qty; p.cost += t.usd; out.push({ ...t, pnl: null, pct: null, cb: 0, kq: 0 }); }
    else {
      const kq = Math.min(t.qty, p.qty); let pnl = null, pct = null, cb = 0;
      if (kq > 1e-12 && p.qty > 0) { cb = p.cost * (kq / p.qty); pnl = t.usd * (kq / t.qty) - cb; pct = cb > 0 ? pnl / cb * 100 : null; p.cost -= cb; p.qty -= kq; }
      out.push({ ...t, pnl, pct, cb, kq });
    }
  }
  const byDay = {};
  for (const t of out) if (t.pnl !== null) { const d = byDay[dayKey(t.ts)] ||= { pnl: 0, n: 0, cb: 0 }; d.pnl += t.pnl; d.n++; d.cb += t.cb; }
  analyze.k = k; analyze.v = { list: out, pos, byDay };
  return analyze.v;
}
const entryOf = m => S.entries[m] || (() => { const p = analyze().pos[m]; return p && p.qty > 0 ? p.cost / p.qty : 0; })();

// ---------- signals ----------
const spike = t => t.vol1h / Math.max(t.vol24h / 24, 1);
function evaluate(rows, r) {
  const out = [];
  for (const t of rows) {
    const safe = !r.requireSafe || (t.safety && t.safety.verdict !== "danger");
    if (t.mcap && t.mcap <= r.maxMcap && t.liq >= r.minLiq && spike(t) >= r.minSpike && t.chg1h > 0 && safe)
      out.push({ id: "b:" + t.mint, kind: "buy", mint: t.mint, text: `${t.symbol}: volume ${spike(t).toFixed(1)}x normal, +${t.chg1h}% in 1h` });
    if (t.chg1h <= r.sellDropPct) out.push({ id: "s:" + t.mint, kind: "sell", mint: t.mint, text: `${t.symbol}: ${t.chg1h}% in 1h` });
  }
  return out;
}
// Chart signals: buy = volume spike + strong green candle; sell = volume spike + red candle, or 15% drop from the recent high.
function chartSignals(c) {
  const out = []; let lb = -99, ls = -99;
  for (let i = 21; i < c.length; i++) {
    let av = 0; for (let k = i - 20; k < i; k++) av += c[k].vol; av /= 20; if (av <= 0) continue;
    const sp = c[i].vol / av, prev = c[i - 1].close; let hi = 0; for (let k = i - 12; k <= i; k++) hi = Math.max(hi, c[k].high);
    if (sp >= 2.5 && c[i].close > c[i].open && c[i].close > prev * 1.01 && i - lb >= 8) { out.push({ time: c[i].time, side: "buy" }); lb = i; }
    else if (((sp >= 2.5 && c[i].close < c[i].open && c[i].close < prev * 0.99) || c[i].close <= hi * 0.85) && i - ls >= 8) { out.push({ time: c[i].time, side: "sell" }); ls = i; }
  }
  return out;
}
function insiderMap() {
  const m = {};
  for (const r of S.rows) for (const i of r.safety?.insiders || []) (m[i.addr] ||= []).push({ mint: r.mint, symbol: r.symbol, pct: i.pct });
  for (const a of Object.keys(S.watch)) m[a] ||= [];
  return m;
}

// ---------- live chart (GeckoTerminal candles + Lightweight Charts) ----------
const CH = { chart: null, candle: null, vol: null, timer: null, tf: "5m", mode: "mc", raw: [], mint: null, tok: "base" };
const TFS = { "1m": ["minute", 1, 60], "5m": ["minute", 5, 300], "15m": ["minute", 15, 900], "1h": ["hour", 1, 3600] };
async function loadOHLCV(pool, tf, limit, tok) {
  const [u, a] = TFS[tf];
  const j = await getJSON(`https://api.geckoterminal.com/api/v2/networks/solana/pools/${pool}/ohlcv/${u}?aggregate=${a}&limit=${limit}&currency=usd&token=${tok}`);
  const l = j?.data?.attributes?.ohlcv_list; if (!Array.isArray(l)) return null;
  return l.map(r => ({ time: r[0], open: +r[1], high: +r[2], low: +r[3], close: +r[4], vol: +r[5] })).sort((x, y) => x.time - y.time);
}
function destroyChart() {
  clearInterval(CH.timer); CH.timer = null;
  try { CH.chart && CH.chart.remove(); } catch {}

function fallbackChart(pair) { const el = $("chart"); if (el && pair) el.innerHTML = `<iframe src="https://dexscreener.com/solana/${esc(pair)}?embed=1&theme=dark&trades=0&info=0" title="Chart"></iframe>`; }
function scaleOf() { const t = row(CH.mint); return CH.mode === "mc" && t && t.price > 0 && t.mcap > 0 ? t.mcap / t.price : 1; }

  CH.vol.setData(CH.raw.map(c => ({ time: c.time, value: c.vol, color: c.close >= c.open ? "rgba(91,242,155,.4)" : "rgba(255,92,108,.4)" })));

}
async function loadChart(fit) {

  try {
    let d = await loadOHLCV(t.pair, CH.tf, 300, CH.tok);
    if (d && d.length && t.price > 0) {
      const r = d[d.length - 1].close / t.price;
      if (r > 5 || r < 0.2) { const alt = CH.tok === "base" ? "quote" : "base", d2 = await loadOHLCV(t.pair, CH.tf, 300, alt); if (d2 && d2.length) { const r2 = d2[d2.length - 1].close / t.price; if (r2 <= 5 && r2 >= 0.2) { d = d2; CH.tok = alt; } } }

}

    : { time: s.time, position: "aboveBar", color: "#FF5C6C", shape: "arrowDown", text: "S" });
  for (const t of analyze().list) if (t.mint === CH.mint && t.ts >= first && t.ts <= lastT + step) {
    const buy = t.side === "buy";
    mk.push({ time: Math.floor(t.ts / step) * step, position: buy ? "belowBar" : "aboveBar", color: buy ? "#5BF29B" : "#FF5C6C", shape: "circle", text: "You " + usd(t.usd) });

// ---------- refresh ----------
const seen = new Set();
function pushAlerts(list) {
  const fresh = list.filter(a => !S.alerts.some(p => p.id === a.id));
  S.alerts = [...fresh, ...S.alerts].slice(0, 60);
  for (const a of fresh) if (!seen.has(a.id)) {
    seen.add(a.id);
    try { if (typeof Notification !== "undefined" && Notification.permission === "granted") new Notification("Tape", { body: a.text }); } catch {}
  }
}
async function refresh() {
  if (S.busy) return; S.busy = true; S.err = "";
  try {
    let sy = [];
    if (S.fomo) {
      if (!S.key) S.err = "Add your Helius key in settings to sync your Fomo wallet.";
      else { const b = await getBalances(S.fomo); if (b) sy = b; else S.err = "Couldn't read your Fomo wallet. Check the address and key."; }
    }
    S.synced = sy;
    const trending = await getTrending();
    if (!trending) S.err = S.err || "Couldn't load trending tokens. Retrying shortly.";
    const mine = await getTokens([SOL, ...sy.map(s => s.mint)]);
    const hot = await getTokens(trending || []);
    const ts = new Set(trending || []);
    const rows = [...mine, ...hot.filter(h => !mine.some(m => m.mint === h.mint))].map(t => ({ ...t, trending: ts.has(t.mint) }));
    await Promise.all(rows.filter(t => t.trending).slice(0, 12).map(async t => { t.safety = await rugCheck(t.mint); }));
    S.rows = rows; S.solUsd = rows.find(r => r.mint === SOL)?.price || S.solUsd;
    pushAlerts(evaluate(rows.filter(t => t.trending), S.rules));
    const addrs = Object.keys(S.watch).slice(0, 10);
    if (addrs.length && S.key) {
      const ev = (await Promise.all(addrs.map(getSwaps))).flat().filter(e => e.ts > (S.watch[e.wallet] || 0));
      pushAlerts(ev.map(e => ({ id: "w:" + e.sig, kind: "insider", mint: e.mint, text: `Insider ${short(e.wallet)} ${e.side} ${dollars(e.sol)}` })));
    }
    render(); updateLive();
    await syncTrades(false);
    const v = portfolio().value, day = new Date().toISOString().slice(0, 10);
    if (v > 0) { S.snaps[day] = v; persist(); }
  } catch (e) { S.err = "Something went wrong. Retrying shortly."; }
  S.busy = false; render(); updateLive();
}

function renderSheet() {
  const s = S.sheet, el = $("sheet");
  destroyChart();
  if (!s) { el.innerHTML = ""; document.body.style.overflow = ""; return; }
  document.body.style.overflow = "hidden";
  let body = "", bar = "";
  if (s.type === "token") {
    const t = row(s.mint) || { mint: s.mint, symbol: sym(s.mint), price: 0, mcap: 0, liq: 0, vol1h: 0, chg1h: 0, chg24h: 0 };
    const held = S.synced.find(x => x.mint === s.mint), sf = t.safety, ins = sf?.insiders || [];
    const jup = `https://jup.ag/swap/${SOL}-${s.mint}`, u = encodeURIComponent(jup), ref = encodeURIComponent(location.origin);
    const ent = held ? entryOf(s.mint) : 0;
    body = `<div class="sh"><button class="ic" data-act="close">${I.back}</button>${avatar(t)}<b>${esc(t.symbol)}</b><span id="px">${usd(t.price)}</span></div>
    <div class="tf">${["1m","5m","15m","1h"].map(v => `<button class="chip ${CH.tf === v ? "on" : ""}" data-act="tf" data-v="${v}">${v}</button>`).join("")}<span style="flex:1"></span>
      ${[["mc","MCap"],["px","Price"]].map(([k, l]) => `<button class="chip ${CH.mode === k ? "on" : ""}" data-act="cmode" data-v="${k}">${l}</button>`).join("")}</div>
    <div id="chart"></div>
    <p class="mute">Live candles. Green and red arrows are buy and sell signals from volume and price. Circles are your own trades.</p>
    <div class="grid"><div class="card"><div class="mute">1h</div><b id="chg">${pill(t.chg1h)}</b></div><div class="card"><div class="mute">24h</div>${pill(t.chg24h)}</div>
      <div class="card"><div class="mute">Market cap</div><b id="mc">${usd(t.mcap)}</b></div><div class="card"><div class="mute">Liquidity</div><b id="liq">${usd(t.liq)}</b></div></div>
    ${sf ? `<div class="card"><b style="color:${tone(sf.verdict)}">${sf.verdict === "ok" ? "Looks OK" : sf.verdict === "caution" ? "Caution" : "High risk"}</b>
      <div class="mute">Risk score ${sf.score} (higher is riskier) · mint ${sf.mintRevoked ? "revoked" : "<b class=down>ACTIVE</b>"} · freeze ${sf.freezeRevoked ? "revoked" : "<b class=down>ACTIVE</b>"} · LP locked ${sf.lp.toFixed(0)}% · top 10 hold ${sf.top10.toFixed(0)}%</div></div>` : `<div class="card mute">No safety report available for this token.</div>`}
    ${held ? `<div class="card"><div class="row"><span>You hold ${held.amount.toLocaleString(undefined, { maximumFractionDigits: 2 })} (${usd(held.amount * t.price)})</span>
      <input style="width:120px" inputmode="decimal" placeholder="Entry price $" value="${S.entries[s.mint] || (ent ? px(ent) : "")}" data-entry="${esc(s.mint)}"></div>
      ${ent > 0 ? `<div class="row" style="margin-top:8px"><span class="mute">${pill((t.price - ent) / ent * 100)} since entry</span><button class="btn ghost sm" data-act="sharePos" data-m="${esc(s.mint)}">Share PnL</button></div>` : ""}</div>` : ""}
    ${ins.length ? `<h2>Insider wallets in this token</h2>` + ins.map(i => walletCard(i.addr, [{ mint: s.mint, symbol: t.symbol, pct: i.pct }])).join("") : ""}`;
    bar = `<div class="bar"><div><button class="btn" data-act="fomo" data-m="${esc(s.mint)}">Buy on Fomo</button>
      <a class="btn ghost" href="https://phantom.app/ul/browse/${u}?ref=${ref}">Phantom</a></div></div>`;
  } else if (s.type === "alerts") {
    body = `<div class="sh"><button class="ic" data-act="close">${I.back}</button><b>Alerts</b></div>` +
      (S.alerts.length ? S.alerts.map(a => `<div class="card" ${a.mint ? `data-open="${esc(a.mint)}"` : ""}><b class="${a.kind === "sell" ? "down" : "up"}">${a.kind}</b> · ${esc(a.text)}</div>`).join("")
      : `<p class="mute pad">Nothing yet. Alerts check while the app is open.</p>`);
  } else if (s.type === "img") {
    body = `<div class="sh"><button class="ic" data-act="close">${I.back}</button><b>Your PnL card</b></div>
      <img src="${S.img}" style="width:100%;border-radius:16px" alt="PnL card"><p class="mute pad">Press and hold the image to save or share it.</p>`;
  } else if (s.type === "settings") {
    body = `<div class="sh"><button class="ic" data-act="close">${I.back}</button><b>Settings</b></div>
    <div class="card"><b>Helius key</b><p class="mute">Needed for your Fomo wallet, trade history and insider alerts. Free at dashboard.helius.dev (API Keys). Saved only on this phone.</p>
      <div class="gap"><input id="kIn" placeholder="Paste key" value="${esc(S.key)}"><button class="btn sm" data-act="saveKey">Save</button></div></div>
    <div class="card"><b>Fomo wallet</b>${S.fomo ? `<div class="row" style="margin-top:6px"><span class="mute">${short(S.fomo)}</span><button class="link" data-act="rmFomo">Disconnect</button></div>`
      : `<p class="mute">Public Solana address only, never a seed phrase or private key.</p><div class="gap"><input id="fIn2" placeholder="Solana address"><button class="btn sm" data-act="addFomo2">Connect</button></div>`}</div>
    <div class="card"><b>Buy alerts</b>${[["maxMcap","Max market cap ($)"],["minLiq","Min liquidity ($)"],["minSpike","Min volume spike (x)"],["sellDropPct","Sell if 1h change ≤ (%)"]].map(([k, l]) =>
      `<label class="r"><span>${l}</span><input inputmode="decimal" value="${S.rules[k]}" data-rule="${k}"></label>`).join("")}
      <label class="r"><span>Only tokens that pass safety checks</span><input type="checkbox" style="width:auto" ${S.rules.requireSafe ? "checked" : ""} data-rule="requireSafe"></label></div>
    <div class="card"><b>Notifications</b><p class="mute">Alerts always show under the bell. Pop-ups work on some phones, while the app is open.</p><button class="btn ghost sm" data-act="notif">Allow notifications</button></div>
    <div class="card mute">Data: Dexscreener (prices, trending), GeckoTerminal (chart candles), RugCheck (safety, insiders), Helius (wallets, trades), CoinGecko (past SOL prices). Signals are simple rules and safety checks only reduce risk. Not financial advice.</div>`;
  }
  el.innerHTML = `<div class="sheet"><div class="in">${body}</div></div>${bar}`;
  if (s.type === "token") mountChart(s.mint);
}
function openSheet(s) { S.sheet = s; renderSheet(); const sh = document.querySelector(".sheet"); if (sh) sh.scrollTop = 0; }
function updateLive() {
  if (S.sheet?.type !== "token") return;
  const t = row(S.sheet.mint); if (!t) return;
  const set = (id, h) => { const e = $(id); if (e) e.innerHTML = h; };
  set("px", usd(t.price)); set("chg", pill(t.chg1h)); set("mc", usd(t.mcap)); set("liq", usd(t.liq));
}

// ---------- events ----------
document.addEventListener("click", e => {
  const tb = e.target.closest("[data-tab]");
  if (tb) { S.tab = tb.dataset.tab; render(); window.scrollTo(0, 0); return; }
  const b = e.target.closest("[data-act]");
  if (!b) { const o = e.target.closest("[data-open]"); if (o) openSheet({ type: "token", mint: o.dataset.open }); return; }
  const v = id => (document.getElementById(id)?.value || "").trim();
  switch (b.dataset.act) {
    case "close": S.sheet = null; renderSheet(); break;
    case "alerts": openSheet({ type: "alerts" }); return;
    case "settings": openSheet({ type: "settings" }); return;
    case "fseg": S.ftab = b.dataset.v; break;
    case "hf": S.hf = b.dataset.v; break;
    case "calprev": S.cal.m--; if (S.cal.m < 0) { S.cal.m = 11; S.cal.y--; } S.cal.sel = null; break;
    case "calnext": S.cal.m++; if (S.cal.m > 11) { S.cal.m = 0; S.cal.y++; } S.cal.sel = null; break;
    case "calday": S.cal.sel = S.cal.sel === b.dataset.k ? null : b.dataset.k; break;
    case "older": b.textContent = "Loading…"; syncTrades(true).then(render); return;
    case "tf": CH.tf = b.dataset.v; document.querySelectorAll('[data-act="tf"]').forEach(x => x.classList.toggle("on", x.dataset.v === CH.tf)); loadChart(true); return;
    case "cmode": CH.mode = b.dataset.v; document.querySelectorAll('[data-act="cmode"]').forEach(x => x.classList.toggle("on", x.dataset.v === CH.mode)); applyChart(); try { CH.chart.timeScale().fitContent(); } catch {} return;
    case "shareTrade": { const t = analyze().list.find(x => x.sig === b.dataset.s); if (t && t.pnl !== null) shareCard(tradeCard(t)); return; }
    case "shareAll": shareCard(summaryCard("All time", analyze().list)); return;
    case "shareMonth": { const { y, m } = S.cal, l = analyze().list.filter(t => { const d = new Date(t.ts * 1000); return d.getFullYear() === y && d.getMonth() === m; });
      shareCard(summaryCard(new Date(y, m, 1).toLocaleDateString(undefined, { month: "long", year: "numeric" }), l)); return; }
    case "sharePos": { const m = b.dataset.m, h = S.synced.find(x => x.mint === m), en = entryOf(m), pr = price(m); if (!h || !(en > 0)) return;
      shareCard({ title: sym(m), kind: "Open position", pnl: h.amount * (pr - en), pct: (pr - en) / en * 100, date: today(),
        rows: [["Avg buy price", "$" + px(en)], ["Current price", "$" + px(pr)], ["Position value", usd(h.amount * pr)], ["Cost", usd(h.amount * en)]] }); return; }
    case "watch": {
      const a = b.dataset.a;
      if (S.watch[a] !== undefined) delete S.watch[a];
      else if (!S.key) { toast("Add your Helius key in settings first."); return; }
      else S.watch[a] = Math.floor(Date.now() / 1000);
      persist();
      document.querySelectorAll(`[data-a="${a}"]`).forEach(x => x.classList.toggle("on", S.watch[a] !== undefined));
      break;
    }
    case "fomo": {
      try { navigator.clipboard.writeText(b.dataset.m); } catch {}
      toast("Token address copied. Paste it in Fomo's search.");
      setTimeout(() => { location.href = "https://fomo.family"; }, 1200);
      return;
    }
    case "addFomo": case "addFomo2": {
      const a = v(b.dataset.act === "addFomo" ? "fIn" : "fIn2");
      if (!ADDR.test(a)) { toast("That doesn't look like a Solana address."); return; }
      if (a !== S.fomo) { S.trades = []; S.histBefore = ""; S.histDone = false; analyze.k = null; }
      S.fomo = a; persist(); refresh(); if (S.sheet?.type === "settings") renderSheet(); break;
    }
    case "rmFomo": S.fomo = ""; S.synced = []; S.trades = []; S.histBefore = ""; S.histDone = false; analyze.k = null; persist(); renderSheet(); break;
    case "saveKey": S.key = v("kIn"); persist(); toast("Saved."); refresh(); break;
    case "notif": try { Notification.requestPermission(); } catch { toast("This browser doesn't support notifications."); } return;
  }
  if (document.activeElement) document.activeElement.blur(); render();
});
document.addEventListener("change", e => {
  const t = e.target;
  if (t.dataset.rule) { const k = t.dataset.rule; S.rules[k] = k === "requireSafe" ? t.checked : (Number(t.value) || 0); persist(); }
  if (t.dataset.entry) { S.entries[t.dataset.entry] = Number(t.value) || 0; persist(); t.blur(); render(); }
});
render(); refresh(); setInterval(refresh, 45000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(); });
</script>
</body>
</html>
